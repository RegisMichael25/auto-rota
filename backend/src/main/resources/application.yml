spring:
  application:
    name: auto-rota-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Listagem lê as paradas de cada plano: carrega em lotes em vez de N+1.
        default_batch_fetch_size: 50
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  # Fuso usado para interpretar o filtro de período do histórico.
  time-zone: America/Sao_Paulo
  external:
    viacep:
      base-url: https://viacep.com.br/ws
    brasilapi:
      base-url: https://brasilapi.com.br/api/cep/v2
    nominatim:
      base-url: https://nominatim.openstreetmap.org
      user-agent: auto-rota-poc/0.0.1 (dev)
      min-interval-ms: 1000
    osrm:
      # Sem OSRM local: OSRM_BASE_URL=https://router.project-osrm.org
      base-url: ${OSRM_BASE_URL:http://localhost:5000}
      profile: driving
      snap-radius-m: 1000
  geocoding:
    # BRASILAPI_FIRST: ViaCEP -> BrasilAPI -> Nominatim (só se faltar coordenada)
    # NOMINATIM_FIRST: ViaCEP -> Nominatim (logradouro + número) -> BrasilAPI
    # Padrão NOMINATIM_FIRST: a BrasilAPI costuma devolver o centro da cidade para CEPs distintos.
    strategy: NOMINATIM_FIRST
  optimizer:
    # DISTANCE (economia de combustível) ou DURATION (tempo de entrega)
    metric: DISTANCE
  fuel:
    default-consumption-km-per-l: 10.00
    default-price-per-l: 6.000
  cors:
    allowed-origins: http://localhost:5173

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5440}/autorota
    username: autorota
    password: autorota

---
spring:
  config:
    activate:
      on-profile: test
  http:
    client:
      connect-timeout: 1s
      read-timeout: 1s
app:
  external:
    viacep:
      base-url: http://localhost:0
    brasilapi:
      base-url: http://localhost:0
    nominatim:
      base-url: http://localhost:0
      user-agent: auto-rota-poc/test
      min-interval-ms: 0
    osrm:
      base-url: http://localhost:0

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
app:
  external:
    nominatim:
      base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
      user-agent: ${NOMINATIM_USER_AGENT}
    osrm:
      base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
      snap-radius-m: ${OSRM_SNAP_RADIUS_M:1000}
  geocoding:
    strategy: ${GEOCODING_STRATEGY:NOMINATIM_FIRST}
  optimizer:
    metric: ${OPTIMIZER_METRIC:DISTANCE}
  fuel:
    default-consumption-km-per-l: ${FUEL_DEFAULT_CONSUMPTION_KM_PER_L:10.00}
    default-price-per-l: ${FUEL_DEFAULT_PRICE_PER_L:6.000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
