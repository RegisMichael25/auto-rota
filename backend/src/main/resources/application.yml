spring:
  application:
    name: auto-rota-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  external:
    viacep:
      base-url: https://viacep.com.br/ws
    brasilapi:
      base-url: https://brasilapi.com.br/api/cep/v2
    nominatim:
      base-url: https://nominatim.openstreetmap.org
      user-agent: auto-rota-poc/0.0.1 (dev)
      min-interval-ms: 1000
    osrm:
      base-url: http://localhost:5000
      profile: driving
  cors:
    allowed-origins: http://localhost:5173

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5440}/autorota
    username: autorota
    password: autorota

---
spring:
  config:
    activate:
      on-profile: test
app:
  external:
    viacep:
      base-url: http://localhost:0
    brasilapi:
      base-url: http://localhost:0
    nominatim:
      base-url: http://localhost:0
      user-agent: auto-rota-poc/test
      min-interval-ms: 0
    osrm:
      base-url: http://localhost:0

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
app:
  external:
    nominatim:
      base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
      user-agent: ${NOMINATIM_USER_AGENT}
    osrm:
      base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
