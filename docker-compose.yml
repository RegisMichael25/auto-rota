services:
  postgres:
    image: postgres:16-alpine
    container_name: autorota-postgres
    environment:
      POSTGRES_DB: autorota
      POSTGRES_USER: autorota
      POSTGRES_PASSWORD: autorota
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autorota -d autorota"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Requer os arquivos .osrm já preparados em ./osrm-data (ver README).
  # Sobe só com: docker-compose --profile osrm up -d
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: autorota-osrm
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld --max-table-size 100 /data/${OSRM_REGION:-sudeste-latest}.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data

volumes:
  postgres-data:
